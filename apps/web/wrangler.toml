# Cloudflare Pages（lovely-memory）の設定。wrangler pages deploy はこのファイルを使い、ダッシュボードでは編集できなくなる
# （ここが正。カスタムドメイン・リダイレクトのルールなど、ここに無い設定はダッシュボード側のまま）
name = "lovely-memory"
pages_build_output_dir = "./dist"
compatibility_date = "2026-11-01"

# ブラウザで起きたエラーの記録（/api/errors）。中身は pnpm lm errors で見る
[[d1_databases]]
binding = "DB"
database_name = "lovely-memory"
database_id = "9cd3f5ff-b1cc-46d0-a001-41e645777558"
migrations_dir = "migrations"

# X の Webhook（/api/x-webhook）が起動するワークフローのリポジトリ。
# 秘密の値（X_WEBHOOK_SECRET・GITHUB_DISPATCH_TOKEN）は wrangler pages secret put で設定する（ここには書かない）
[vars]
GITHUB_REPOSITORY = "Ronny-zzl/lovely-memory"

# 入力画面（/api/edit）：プレビュー版を守る Cloudflare Access のチームと、そのアプリケーションの AUD タグ。
# Access の署名付きトークンを確かめるのに使う（秘密ではない）
ACCESS_TEAM_DOMAIN = "https://lovely-memory-pages.cloudflareaccess.com"
ACCESS_AUD = "082ecd3a90cadb6fff2191ce9c177a8ac381540b0a4dd7de4add42e25c3dd899"
