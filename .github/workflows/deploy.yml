name: Deploy

on:
  push:
    branches: [main]
  # 同期・セトリ取り込みワークフローの commit は GITHUB_TOKEN によるもので push イベントを発火しないため、完了を受けてデプロイする
  workflow_run:
    workflows: ["Sync events", "Import setlist"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      # Node のバージョンは mise.toml で管理
      - uses: jdx/mise-action@v2
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - name: Validate data
        run: pnpm -s lm validate all
      # アセットは相対パスなので、同じビルドをどの配信先でも使える
      - name: Build
        run: pnpm build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: apps/web/dist

  github-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # リポジトリ変数 CLOUDFLARE_PROJECT と、シークレット CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID が必要
  cloudflare:
    needs: build
    if: vars.CLOUDFLARE_PROJECT != ''
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: ${{ vars.CLOUDFLARE_PROJECT }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist
      - name: Check secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID のシークレットが設定されていません"
            exit 1
          fi
      # 認証エラーの原因を切り分けるための確認（トークンの値は出力しない）
      - name: Check token
        run: |
          api() { curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4$1"; }
          echo "token length: ${#CLOUDFLARE_API_TOKEN}, account id length: ${#CLOUDFLARE_ACCOUNT_ID}"
          echo "--- user token verify";    api /user/tokens/verify | jq -c '{success, status: .result.status, errors: [.errors[]?.message]}'
          echo "--- account token verify"; api "/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify" | jq -c '{success, status: .result.status, errors: [.errors[]?.message]}'
          echo "--- account access";       api "/accounts/$CLOUDFLARE_ACCOUNT_ID" | jq -c '{success, errors: [.errors[]?.message]}'
          # アカウント ID 自体は公開ログに出さず、一致するかだけを出す
          echo "--- accounts visible to the token"
          api "/accounts" | jq -c --arg id "$CLOUDFLARE_ACCOUNT_ID" '{count: (.result | length?), account_id_matches: ([.result[]?.id] | index($id) != null)}'
          echo "--- pages projects";       api "/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects" | jq -c '{success, count: (.result | length?), errors: [.errors[]?.message]}'
      # wrangler-action は新しい npm で npx が止まるため、wrangler を直接使う
      - name: Create Pages project (first time only)
        run: |
          if npx --yes wrangler@4 pages project list 2>/dev/null | grep -qw "$PROJECT"; then
            echo "project $PROJECT exists"
          else
            npx --yes wrangler@4 pages project create "$PROJECT" --production-branch=main
          fi
      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@4 pages deploy dist --project-name="$PROJECT" --branch=main --commit-dirty=true
