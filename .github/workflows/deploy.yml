name: Deploy

on:
  push:
    branches: [main]
  # 同期・セトリ取り込みワークフローの commit は GITHUB_TOKEN によるもので push イベントを発火しないため、完了を受けてデプロイする
  workflow_run:
    workflows: ["Sync events", "Import setlist"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      # Node のバージョンは mise.toml で管理
      - uses: jdx/mise-action@v2
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - name: Validate data
        run: pnpm -s lm validate all
      # アセットは相対パスなので、同じビルドをどの配信先でも使える
      - name: Build
        run: pnpm build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: apps/web/dist

  github-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # リポジトリ変数 CLOUDFLARE_PROJECT と、シークレット CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID が必要
  cloudflare:
    needs: build
    if: vars.CLOUDFLARE_PROJECT != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist
      # 初回だけプロジェクトを作る（既にあればエラーになるが無視する）
      - name: Create Pages project
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create ${{ vars.CLOUDFLARE_PROJECT }} --production-branch=main
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PROJECT }} --branch=main --commit-dirty=true
