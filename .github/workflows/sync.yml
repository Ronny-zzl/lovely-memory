name: Sync events

on:
  schedule:
    # 毎日 05:00 JST
    - cron: "0 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-events
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Sync from eventernote
        run: pnpm -s lm sync all | tee sync.log

      - name: Commit changes
        run: |
          if git diff --quiet -- artists; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artists
          {
            echo "Sync events from eventernote"
            echo
            grep -E '^\[[^]]+\] [+~-] ' sync.log || true
          } > commit-msg.txt
          git commit -F commit-msg.txt
          git push
