name: Sync events

on:
  schedule:
    # 毎日 05:00 JST: 直近 30 日以内と今後のイベントのみ
    - cron: "0 20 * * *"
    # 毎月 2 日 04:00 JST (1 日 19:00 UTC): 全件取り直し（後から登録・修正されたイベントの拾い漏れ対策）
    - cron: "0 19 1 * *"
  workflow_dispatch:
    inputs:
      full:
        description: "全件取り直す"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-events
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # Node のバージョンは mise.toml で管理
      - uses: jdx/mise-action@v2
      - uses: pnpm/action-setup@v4

      - run: pnpm install --frozen-lockfile

      - name: Sync from eventernote
        env:
          FULL: ${{ github.event.schedule == '0 19 1 * *' || inputs.full == true }}
        run: pnpm -s lm sync all $([ "$FULL" = "true" ] && echo --full) | tee sync.log

      - name: Commit changes
        run: |
          if git diff --quiet -- artists; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artists
          {
            echo "Sync events from eventernote"
            echo
            grep -E '^\[[^]]+\] [+~-] ' sync.log || true
          } > commit-msg.txt
          git commit -F commit-msg.txt
          # セトリ取り込みワークフローと同時に push した場合に備えて、rebase して数回試す
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1

      # 当日のライブ（と取りこぼした直近 7 日分）にセトリ入力用 Issue を作る
      - name: Open setlist issues
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: pnpm -s lm open-setlist-issues all
