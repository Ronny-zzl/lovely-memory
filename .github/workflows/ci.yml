name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # Node のバージョンは mise.toml で管理
      - uses: jdx/mise-action@v5
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Validate data
        run: pnpm -s lm validate all
      # 依存関係の更新（Renovate の自動マージ）でビルドが壊れないことも確認する
      - name: Build
        run: pnpm build
      # 全ページを Chrome で開き、表示・エラーが無いことを確認（Renovate の自動マージで画面が壊れないように）
      - name: Smoke test
        run: pnpm smoke
