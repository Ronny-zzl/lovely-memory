<!doctype html>
<!-- サイト共有用の OGP 画像（1200×630）。render.sh で apps/web/public/og.png に書き出す -->
<html lang="ja">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=block" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    font-family: "M PLUS Rounded 1c", sans-serif;
    /* 左：朝の光 → 中央：夕暮れ → 右：夜空 */
    background: linear-gradient(105deg, #fff5d6 0%, #ffdca6 24%, #f7ae78 42%, #b4688f 50%, #5a4589 58%, #2f2c6c 74%, #1b1f4d 100%);
  }
  /* 夜空の星 */
  .stars {
    position: absolute; inset: 0;
    background:
      radial-gradient(circle at 68% 18%, #fff 0 1.6px, transparent 2.4px),
      radial-gradient(circle at 74% 82%, #fff 0 1.2px, transparent 2px),
      radial-gradient(circle at 81% 64%, #fffbe6 0 1.8px, transparent 2.6px),
      radial-gradient(circle at 88% 88%, #fff 0 1.2px, transparent 2px),
      radial-gradient(circle at 94% 46%, #fff 0 1.4px, transparent 2.2px),
      radial-gradient(circle at 63% 90%, #fffbe6 0 1.2px, transparent 2px),
      radial-gradient(circle at 97% 12%, #fff 0 1.2px, transparent 2px),
      radial-gradient(circle at 70% 48%, #fff 0 1px, transparent 1.8px),
      radial-gradient(circle at 86% 30%, #fff 0 1px, transparent 1.8px);
    opacity: 0.9;
  }
  .sun {
    position: absolute; left: 44px; top: 40px; width: 132px; height: 132px; color: #f39a1e;
    filter: drop-shadow(0 0 28px rgb(255 190 80 / 0.9));
  }
  .moon {
    position: absolute; right: 56px; top: 44px; width: 116px; height: 116px; color: #ffe7a6;
    filter: drop-shadow(0 0 24px rgb(255 236 170 / 0.55));
  }
  .card {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 840px; padding: 40px 48px 38px;
    border-radius: 40px;
    background: rgb(255 255 255 / 0.93);
    box-shadow: 0 20px 60px rgb(30 20 60 / 0.25);
    text-align: center;
  }
  .group { font-size: 30px; font-weight: 800; color: #4a3f7a; letter-spacing: 0.04em; }
  .group small { font-size: 22px; font-weight: 500; color: #8a7fa8; margin-left: 10px; letter-spacing: 0.02em; }
  h1 {
    margin-top: 10px;
    font-size: 96px; font-weight: 800; line-height: 1.2; letter-spacing: 0.02em; white-space: nowrap;
    background: linear-gradient(90deg, #e98a1f 0%, #d9658a 50%, #4b3f9a 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .lead { margin-top: 8px; font-size: 30px; font-weight: 500; color: #4d4860; }
  .dots { display: flex; justify-content: center; gap: 18px; margin-top: 26px; }
  .dots span { width: 26px; height: 26px; border-radius: 50%; box-shadow: inset 0 0 0 2px rgb(0 0 0 / 0.06); }
  .note { position: absolute; left: 0; right: 0; bottom: 22px; text-align: center; font-size: 20px; font-weight: 500; color: rgb(255 255 255 / 0.85); text-shadow: 0 1px 4px rgb(30 20 60 / 0.5); }
</style>
</head>
<body>
  <div class="stars"></div>
  <svg class="sun" viewBox="0 0 16 16" aria-hidden="true">
    <circle cx="8" cy="8" r="3.4" fill="currentColor" />
    <g stroke="currentColor" stroke-width="1.1" stroke-linecap="round">
      <line x1="8" y1="1" x2="8" y2="2.8" /><line x1="8" y1="13.2" x2="8" y2="15" />
      <line x1="1" y1="8" x2="2.8" y2="8" /><line x1="13.2" y1="8" x2="15" y2="8" />
      <line x1="3.05" y1="3.05" x2="4.3" y2="4.3" /><line x1="11.7" y1="11.7" x2="12.95" y2="12.95" />
      <line x1="3.05" y1="12.95" x2="4.3" y2="11.7" /><line x1="11.7" y1="4.3" x2="12.95" y2="3.05" />
    </g>
  </svg>
  <svg class="moon" viewBox="0 0 16 16" aria-hidden="true">
    <path d="M10.2 2.2A6 6 0 1 0 13.8 11 4.8 4.8 0 0 1 10.2 2.2Z" fill="currentColor" />
  </svg>
  <div class="card">
    <div class="group">太陽と踊れ月夜に唄え<small>Second Season</small></div>
    <h1>ラブリィメモリー</h1>
    <p class="lead">ライブのセットリスト記録・集計</p>
    <div class="dots">
      <span style="background:#F5B5C8"></span><span style="background:#2F6FDB"></span><span style="background:#E53935"></span>
      <span style="background:#5CC8F0"></span><span style="background:#8BD67A"></span><span style="background:#8E5CC8"></span>
    </div>
  </div>
  <p class="note">非公式ファンサイト</p>
</body>
</html>
